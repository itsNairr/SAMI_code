serial_number: "a200-0000"
version: 0
system:
  username: "clearpath"
  hosts:
    - hostname: "cpr-husky"
      ip: "192.168.131.1"

platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
      model: default
    - name: sensor_arch
      type: a200.sensor_arch
      parent: default_mount
      model: sensor_arch_300
      enabled: true

sensors:
  lidar2d:
    - model: sick_lms1xx
      urdf_enabled: true
      launch_enabled: true
      parent: sensor_arch_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]

  camera:
    # Forward facing camera
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: front_bumper_mount
      xyz: [-0.02, 0.0, 0.05]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: camera_0

    # Downward facing camera
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: front_bumper_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.78539, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: camera_1

  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
